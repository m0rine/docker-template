# We are going to try and build separate frontend / backend service.
# A simple example is a site that displays your IP on a button press,
# And saves it to a database.  Processing of a web request beyond simple HTML/CSS serving is required for this app, hence we need a backend.
# Services needed: Frontend: JS/HTML/CSS, Backend: Python, DB: PostgreSQL
services:
  postgres:
    image: postgres:17.3
    container_name: template-db
    restart: always
    environment:
      POSTGRES_DB: example_db
      POSTGRES_USER_FILE: /run/secrets/POSTGRES_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      postgres_data:/var/lib/postgresql/data
  nginx:
    image: nginx:latest
    container_name: template_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/static:/usr/share/nginx/html
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
  backend:
    image:
      # Build context is relative to docker-compose.yml path
      build:
        context: ./backend/
        dockerfile: Dockerfile
    container_name: template_backend
    restart: always 
    ports:
      - "8400:8400"
    
# Actually defining the secret from a file      
secrets:
  POSTGRES_USER:
    file: secrets/postgres_user
  POSTGRES_PASSWORD:
    file: secrets/postgres_password

