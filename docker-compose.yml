# We are going to try and build separate frontend / middleware service.
# A simple example is a site that displays your IP on a button press
# And saves it to a database.  Processing of a web request beyond simple HTML/CSS serving is required for this app, hence we need a middleware.
# Services needed: Frontend: JS/HTML/CSS, Backend: Python, DB: PostgreSQL
#
services:
  postgres:
    image: postgres:18.4
    container_name: template-db
    restart: always
    environment:
      POSTGRES_USER_FILE: /run/secrets/POSTGRES_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_DB: "postgres"
    ports:
      - "5432:5432"
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
  nginx:
    image: nginx:latest
    container_name: template-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/static:/usr/share/nginx/html
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf
  middleware:
    build:
      context: ./middleware/
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./middleware/src:/server/src
    container_name: template-middleware
    restart: always 
    environment:
      POSTGRES_HOST: template-db
      POSTGRES_DB: "postgres"
    ports:
      - "8000:8000"
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
# Actually defining the secret from a file      
secrets:
  POSTGRES_USER:
    file: secrets/postgres_user
  POSTGRES_PASSWORD:
    file: secrets/postgres_password
volumes:
  postgres_data:

