name: Docker Build and Push Image 
on:
  push:
    branches: [ "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Log in to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}
    - name: Build And Push Images
      run: |
        # Build, tag, and push.  
        # Multiple images will show in DockerHub, but they the same digest (hash), so extra space is not consumed.
        PREFIX="docker.io/${{ secrets.DOCKER_USER }}"/template
        POSTFIX="$(git log --format=%H -1)"
        NAME="frontend"; docker buildx build --target prod -t "$PREFIX:$NAME-$POSTFIX" -t "$PREFIX:$NAME-latest" --push ./$NAME
        NAME="middleware"; docker buildx build --target prod -t "$PREFIX:$NAME-$POSTFIX" -t "$PREFIX:$NAME-latest" --push ./$NAME
        NAME="database"; docker buildx build -t "$PREFIX:$NAME-$POSTFIX" -t "$PREFIX:$NAME-latest" --push ./$NAME
